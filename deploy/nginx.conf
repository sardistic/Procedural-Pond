# Static hosting for Procedural Pond (installed as conf.d/default.conf).

# HTML revalidates every time; scripts and styles are versioned with ?v=N in
# index.html, so they can be cached for a week.
map $uri $pond_cache {
  default                                    "no-cache";
  ~*\.(?:js|css)$                            "public, max-age=604800";
  ~*\.(?:png|ico|webmanifest|xml|txt)$       "public, max-age=86400";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/manifest+json application/xml text/plain;

  add_header Cache-Control $pond_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Cloudflare injects its Web Analytics beacon at the edge; allow it and its report endpoint.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # nginx's mime.types has no entry for web app manifests.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  error_page 404 /404.html;
}
