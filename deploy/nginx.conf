# Static hosting for Procedural Pond (installed as conf.d/default.conf).

# HTML revalidates every time; scripts and styles are versioned with ?v=N in
# index.html, so they can be cached for a week. The API is never cached.
map $uri $pond_cache {
  default                                    "no-cache";
  ~^/api/                                    "no-store";
  ~*\.(?:js|css)$                            "public, max-age=604800";
  ~*\.(?:png|ico|webmanifest|xml|txt)$       "public, max-age=86400";
}

# The pond API allows a request a second per visitor (Cloudflare gives us their
# address), with room for bursts.
limit_req_zone $http_cf_connecting_ip zone=pond_api:1m rate=60r/m;

# pond.nz is the canonical home. The old subdomain and www send visitors (and
# search engines) there permanently, keeping the path and ?pond= seed.
server {
  listen 80;
  server_name pond.sardistic.com www.pond.nz;
  server_tokens off;
  return 301 https://pond.nz$request_uri;
}

# pond.nz, plus anything else (the container health check uses 127.0.0.1).
server {
  listen 80 default_server;
  server_name pond.nz _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # Visitors on plain http (Cloudflare tells us via X-Forwarded-Proto) go to https.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://pond.nz$request_uri;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/manifest+json application/xml text/plain;

  add_header Cache-Control $pond_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Cloudflare injects its Web Analytics beacon at the edge; allow it and its report endpoint.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Short pond links (/amber-heron-moss-lantern) open the page, which fetches the pond.
  location ~ "^/[a-z]{2,8}(-[a-z]{2,8}){3}$" {
    try_files /index.html =404;
  }

  # The pond API (server/ in the repo, the "api" service next to this one). The
  # name is looked up per request, so the site still starts and serves while the
  # API is down; the page then falls back to long #s= links.
  location ^~ /api/ {
    limit_req zone=pond_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pond_api http://api:8080;
    proxy_pass $pond_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
  }

  # nginx's mime.types has no entry for web app manifests.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  error_page 404 /404.html;
}
